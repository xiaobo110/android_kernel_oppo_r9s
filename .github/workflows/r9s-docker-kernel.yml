name: r9s-docker-kernel

# 为 OPPO R9s/R9sk (msm8953, 3.18.31) 编译带容器支持的 boot 内核 + 配套 .ko
# 产物在 artifact 里，本地用 repack_boot.py 拼成可刷的 boot.img。

# 只手动触发：改代码后用 workflow_dispatch 重跑，避免 push 同时起第二个 90 分钟的构建
on:
  workflow_dispatch:
    inputs:
      verbose:
        description: "在日志里多打印配置校验结果"
        required: false
        default: "0"

jobs:
  build:
    # 固定 22.04：老 gcc 预编译包在新 glibc 上偶发缺 libmpfr.so.4，两处都做了兜底
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            device-tree-compiler xz-utils lz4 cpio rsync python3 python2 libmpfr6 libgmp10
          # 这棵树里有 #!/usr/bin/env python2 的脚本（上一轮就是被它顶死在 Error 127），列出来备查
          echo "== 需要 python2 的脚本 =="
          grep -rl 'usr/bin/env python2' --include='*.py' --include='*.pl' . 2>/dev/null | head -10
          python2 -V 2>&1 | head -1

      - name: 获取 aarch64 gcc 4.9 交叉工具链
        # 内核 banner 显示 crDroid 用的就是 gcc 4.9，用同代编译器最稳（3.18 在 gcc10+ 上会因
        # -fno-common 等一堆问题编不过）。
        # 注意 kernel.org 的真实文件名带 x86_64- 前缀；releases.linaro.org 已整站跳转、不可用。
        run: |
          set -e
          mkdir -p /home/runner/tc && cd /home/runner/tc
          KP=/pub/tools/crosstool/files/bin/x86_64/4.9.4/x86_64-gcc-4.9.4-nolibc-aarch64-linux
          URLS="https://cdn.kernel.org${KP}.tar.xz https://www.kernel.org${KP}.tar.xz https://www.kernel.org${KP}.tar.gz"
          for u in $URLS; do
            echo "--- trying $u"
            rm -rf tc.* tcdir; mkdir -p tcdir
            if ! curl -fL --retry 3 --max-time 900 -o tc.dl "$u"; then echo "  下载失败"; continue; fi
            # 只看 http 码不够：要确认拿回来的确实是归档并能解开、gcc 真能跑
            if ! tar -xf tc.dl -C tcdir 2>/dev/null; then echo "  不是有效归档（大小 $(stat -c%s tc.dl)）"; continue; fi
            # 真实布局是 tcdir/x86_64-gcc-4.9.4-nolibc/aarch64-linux/bin/aarch64-linux-gcc，
            # 驱动文件在第 4 层，之前 maxdepth 3 + -type f 会漏掉（可能是符号链接），所以放宽再逐个试跑
            GCC=$(find /home/runner/tc/tcdir -path '*/bin/*gcc' 2>/dev/null | head -1)
            [ -n "$GCC" ] || { echo "  归档里没有 gcc driver：$(ls -R /home/runner/tc/tcdir | head -20)"; continue; }
            if "$GCC" --version 2>&1 | head -1; then echo "  可用：$u"; cp tc.dl tc.ok; break; else echo "  gcc 跑不起来"; fi
          done
          GCC=$(find /home/runner/tc/tcdir -path '*/bin/*gcc' 2>/dev/null | head -1)
          if [ ! -f tc.ok ] || [ -z "$GCC" ]; then
            echo "kernel.org 全部失败，退回 apt 的 aarch64 交叉 gcc（版本新，需要 -fcommon 兜住 3.18）"
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            GCC=$(command -v aarch64-linux-gnu-gcc)
            echo "EXTRA_KCFLAGS=-fcommon" >> "$GITHUB_ENV"
          fi
          echo "gcc driver: $GCC"
          "$GCC" --version | head -1
          # HOSTCC 用的是 runner 自带的 gcc-11，它默认 -fno-common，会让 3.18 的
          # scripts/dtc（yylloc 重复定义）链接失败；交叉 gcc 换老版本也治不了 host 工具，
          # 所以统一给 host 编译加 -fcommon。
          echo "HOST_EXTRACFLAGS=-fcommon" >> "$GITHUB_ENV"
          BINDIR=$(dirname "$GCC")
          echo "CROSS_COMPILE=$(basename "$GCC" | sed 's/-gcc$//')-" >> "$GITHUB_ENV"
          echo "TC_BINDIR=$BINDIR" >> "$GITHUB_ENV"
          # 内核 scripts/gcc-version.sh 是按命令名直接调 $(CROSS_COMPILE)gcc 的，
          # 只给绝对路径没用，必须把工具链 bin 追加进后续步骤的 PATH
          echo "$BINDIR" >> "$GITHUB_PATH"
          # 新版 libmpfr/libgmp 的名字兜底
          for lib in libmpfr.so.4 libgmp.so.10; do
            have=$(ldd "$GCC" 2>/dev/null | grep -c "$lib.*not found" || true)
            if [ "$have" != "0" ]; then
              case "$lib" in
                libmpfr*) real=/usr/lib/x86_64-linux-gnu/libmpfr.so.6 ;;
                libgmp*)  real=/usr/lib/x86_64-linux-gnu/libgmp.so.10 ;;
              esac
              mkdir -p /home/runner/tc/compat
              ln -sf "$real" "/home/runner/tc/compat/$lib"
              echo "LD_LIBRARY_PATH=/home/runner/tc/compat" >> "$GITHUB_ENV"
              echo "linked $lib -> $real"
            fi
          done

      - name: 应用容器补丁
        run: |
          python3 build/patch_qtaguid.py
          git config user.email ci@example.invalid
          git config user.name "ci"
          # 提交让树变 clean，KERNELRELEASE 后缀可复现
          git add -A && git commit -q -m "r9s: containers (qtaguid stub, config fragment, ci)" || true
          git status --short | head

      - name: 配置
        # 不用 merge_config.sh：它在 O=out 时会把合并结果写到源码根的 ./.config，
        # 于是 make O=out 又去读未合并的 out/.config —— 上一轮片段就是这么全军覆没的。
        # 改为把片段直接追加到 r9s_defconfig 末尾：kconfig 顺序读取，同名符号后者胜出，
        # 这也和 hengwu0 原补丁的做法一致。
        run: |
          set -e
          grep -E '^(CONFIG_[A-Z0-9_]+=.+|# CONFIG_[A-Z0-9_]+ is not set)$' \
            build/r9s-docker.fragment >> arch/arm64/configs/r9s_defconfig
          echo "追加进 defconfig 的行数: $(grep -cE '^(CONFIG_|# CONFIG_.* is not set$)' build/r9s-docker.fragment)"
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out r9s_defconfig
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out olddefconfig
          echo "out/.config 中 =y/=m 计数: $(grep -cE '^CONFIG_.*=[ym]$' out/.config)"
          bash build/verify-config.sh out/.config

      - name: 编译 Image.gz-dtb 与模块
        # 分两次 make：boot/Makefile 用 $(shell find ... -name '*.dtb') 决定要拼哪些 dtb，
        # 第一次 make 时 dtb 还没生成会是空列表，所以先出 dtbs/modules，再出 Image.gz-dtb。
        # 本地重打包默认用 base boot.img 里原有的 4 个 DTB，这里只是顺带产出可比对的副本。
        run: |
          set -eo pipefail
          mk() { make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" O=out KCFLAGS="-w ${EXTRA_KCFLAGS:-}" "$@"; }
          mk -j"$(nproc)" dtbs modules > build.log 2>&1 \
            || { echo "=== BUILD FAILED ==="; tail -100 build.log; exit 1; }
          mk Image.gz >> build.log 2>&1 || { tail -60 build.log; exit 1; }
          mk Image.gz-dtb >> build.log 2>&1 || echo "Image.gz-dtb target unavailable (will append DTBs locally)"
          tail -20 build.log
          ls -l out/arch/arm64/boot/
          echo "dtb count: $(find out/arch/arm64/boot/dts -name '*.dtb' | wc -l)"

      - name: 汇总产物
        run: |
          set -e
          D=artifacts; rm -rf $D; mkdir -p $D/modules $D/dtb
          cp out/arch/arm64/boot/Image.gz-dtb $D/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz $D/ 2>/dev/null || true
          cp out/.config $D/config.txt
          cp build.log $D/ 2>/dev/null || true
          cp out/System.map $D/ 2>/dev/null || true
          [ -f out/include/config/kernel.release ] && cp out/include/config/kernel.release $D/vermagic.txt
          # 逐个 dtb 的大小，方便和 crDroid 现有的 241685/251702/243864/248550 对照
          find out/arch/arm64/boot/dts -name '*.dtb' -printf '%s\t%P\n' | sort -n > $D/dtb/sizes.tsv || true
          while IFS=$'\t' read -r sz path; do
            cp "out/arch/arm64/boot/dts/$path" "$D/dtb/$(basename "$path")" || true
          done < $D/dtb/sizes.tsv
          find out -name '*.ko' -printf '%s\t%P\n' | sort -n > $D/modules/list.tsv
          while IFS=$'\t' read -r sz path; do
            cp "out/$path" "$D/modules/$(basename "$path")" || true
          done < $D/modules/list.tsv
          {
            echo "== banner =="
            python3 - "$D" <<'PY'
          import gzip, re, sys, os
          p = os.path.join(sys.argv[1], "Image.gz")
          raw = gzip.open(p, "rb").read(1 << 20)
          m = re.findall(rb"Linux version [0-9][^\x00\n]{0,120}", raw)
          print(m[0].decode("latin1") if m else "banner not found")
          PY
            echo "== modules built =="; cat "$D/modules/list.tsv"
            echo "== dtbs built =="; cat "$D/dtb/sizes.tsv"
            echo "== vermagic =="; cat "$D/vermagic.txt" 2>/dev/null
          } > $D/INFO.txt
          cat $D/INFO.txt
          du -sh $D

      - uses: actions/upload-artifact@v4
        with:
          name: r9s-docker-kernel-${{ github.run_number }}
          path: artifacts
          retention-days: 30
